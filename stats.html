<!DOCTYPE html>

<meta property="og:title" content="Player Stat Tracker">
<meta property="og:description" content="Per-game water polo stat tracking with season totals and rolling averages per player.">

<style>

<body>
<div id="app"></div>
<footer>
  Stats live in this browser · use <a href="#/data">Data &amp; backup</a> to export or move to another device
</footer>

<script>
// ==================== STAT DEFINITIONS ====================
// Columns mirror the paper stat sheet: Shots, Goals, Assists, Blocks,
// Earned (exclusions drawn), Penalty (exclusions committed), Steals, TO,
// plus goalie Saves / Goals Against.
const STATS = [
  { key: 'sh', short: 'SH',  label: 'Shots' },
  { key: 'gl', short: 'GL',  label: 'Goals' },
  { key: 'as', short: 'AS',  label: 'Assists' },
  { key: 'bk', short: 'BK',  label: 'Blocks' },
  { key: 'st', short: 'ST',  label: 'Steals' },
  { key: 'ed', short: 'EX+', label: 'Exclusions drawn' },
  { key: 'ex', short: 'EX-', label: 'Exclusions committed' },
  { key: 'to', short: 'TO',  label: 'Turnovers' },
];
const GK_STATS = [
  { key: 'sv', short: 'SV', label: 'Saves' },
  { key: 'ga', short: 'GA', label: 'Goals against' },
];
const ALL_STATS = STATS.concat(GK_STATS);

// ==================== STORAGE ====================
const DB_KEY = 'polo-stat-tracker-v1';

function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID().slice(0, 8);
  return Math.random().toString(36).slice(2, 10);
}

function todayStr() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function defaultDB() {
  // Roster seeded from the June 2026 paper stat sheet — edit freely on the Players tab.
  const seed = [
    ['2', 'Beckett Bravo'], ['3', 'Owen DeShazer'], ['4', 'Ben Eastep'],
    ['6', 'Jackson Greenlee'], ['7', 'Brayden Hayes'], ['8', 'Jai Merlo'],
    ['9', 'Coulter Isenburg'], ['10', 'Evan Nguyen'], ['11', 'Jackson Pangilinan'],
    ['12', 'Xavier Portet'], ['14', 'Bryce Jaeger'], ['15', 'John Endemann'],
  ];
  return {
    version: 1,
    settings: { team: 'Alameda', season: 'Summer 2026' },
    players: seed.map(([cap, name]) => ({ id: uid(), cap, name, active: true })),
    games: [],
  };
}

let db = loadDB();

function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (!raw) return defaultDB();
    const obj = JSON.parse(raw);
    if (!obj || !Array.isArray(obj.players) || !Array.isArray(obj.games)) return defaultDB();
    obj.settings = obj.settings || { team: 'Alameda', season: '' };
    return obj;
  } catch (e) { return defaultDB(); }
}

function saveDB() {
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
  catch (e) { console.error('Failed to save', e); }
}

function mutate(fn) { fn(); saveDB(); render(); }

// ==================== DATA HELPERS ====================
function playerById(id) { return db.players.find(p => p.id === id); }
function gameById(id) { return db.games.find(g => g.id === id); }

function capSort(a, b) {
  const na = parseInt(a.cap, 10), nb = parseInt(b.cap, 10);
  const va = isNaN(na) ? 999 : na, vb = isNaN(nb) ? 999 : nb;
  return va - vb || a.name.localeCompare(b.name);
}

function sortedPlayers(includeInactive) {
  return db.players.filter(p => includeInactive || p.active).slice().sort(capSort);
}

function sortedGames() {
  return db.games.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.created || 0) - (b.created || 0));
}

function emptyLine() {
  const o = { gk: false };
  ALL_STATS.forEach(s => o[s.key] = 0);
  return o;
}

function gameLine(game, pid) {
  if (!game.stats[pid]) game.stats[pid] = emptyLine();
  return game.stats[pid];
}

function seasons() {
  const set = new Set();
  db.games.forEach(g => { if (g.season) set.add(g.season); });
  if (db.settings.season) set.add(db.settings.season);
  return [...set].sort();
}

// Games (chronological) a player appeared in, optionally filtered to one season.
function playerGames(pid, season) {
  return sortedGames().filter(g =>
    g.roster.indexOf(pid) >= 0 && (!season || g.season === season));
}

function sumLines(lines) {
  const t = {};
  ALL_STATS.forEach(s => t[s.key] = 0);
  lines.forEach(l => ALL_STATS.forEach(s => t[s.key] += (l && l[s.key]) || 0));
  return t;
}

function playerSeasonStats(pid, season) {
  const games = playerGames(pid, season);
  const lines = games.map(g => g.stats[pid] || emptyLine());
  const totals = sumLines(lines);
  const last5 = sumLines(lines.slice(-5));
  const gkGames = lines.filter(l => l && l.gk).length;
  return { games, gp: games.length, totals, last5, last5n: Math.min(5, games.length), gkGames };
}

function pct(num, den) { return den > 0 ? Math.round(100 * num / den) : null; }
function avg(total, n) { return n > 0 ? (total / n).toFixed(1) : '–'; }

function gameResult(g) {
  if (g.scoreUs == null || g.scoreThem == null || g.scoreUs === '' || g.scoreThem === '') return null;
  const us = Number(g.scoreUs), them = Number(g.scoreThem);
  if (us > them) return 'w';
  if (us < them) return 'l';
  return 't';
}

function fmtDate(iso) {
  if (!iso) return 'No date';
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
function fmtDateShort(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

// ==================== DOM HELPER ====================
function el(tag, props, ...children) {
  const e = document.createElement(tag);
  if (props) {
    for (const k in props) {
      if (props[k] == null || props[k] === false) continue;
      if (k === 'style' && typeof props[k] === 'object') Object.assign(e.style, props[k]);
      else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), props[k]);
      else if (k === 'class' || k === 'className') e.className = props[k];
      else if (k === 'value') e.value = props[k];
      else if (k === 'checked') e.checked = props[k];
      else if (k === 'selected') e.selected = props[k];
      else e.setAttribute(k, props[k]);
    }
  }
  for (const c of children) {
    if (c == null || c === false) continue;
    if (Array.isArray(c)) c.forEach(cc => cc != null && cc !== false && e.appendChild(typeof cc === 'string' || typeof cc === 'number' ? document.createTextNode(String(cc)) : cc));
    else if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(String(c)));
    else e.appendChild(c);
  }
  return e;
}

// ==================== SHARE / EXPORT ====================
function copyToClipboard(text, btn, doneLabel) {
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(fallback);
  } else { fallback(); }
  if (btn) {
    const orig = btn.textContent;
    btn.classList.add('copied');
    btn.textContent = doneLabel || 'Copied!';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = orig; }, 1500);
  }
}

function playerShareText(p, season) {
  const s = playerSeasonStats(p.id, season);
  const t = s.totals;
  const lines = [];
  lines.push(db.settings.team + ' · ' + p.name + (p.cap ? ' #' + p.cap : ''));
  lines.push((season || 'All seasons') + ' · ' + s.gp + ' game' + (s.gp === 1 ? '' : 's'));
  if (s.gp) {
    const shootPct = pct(t.gl, t.sh);
    lines.push('Goals ' + t.gl + ' · Assists ' + t.as + ' · Shots ' + t.sh + (shootPct != null ? ' (' + shootPct + '% shooting)' : ''));
    lines.push('Steals ' + t.st + ' · Blocks ' + t.bk + ' · Excl drawn ' + t.ed + ' · Excl ' + t.ex + ' · TO ' + t.to);
    lines.push('Per game: ' + avg(t.gl, s.gp) + ' G · ' + avg(t.as, s.gp) + ' A · ' + avg(t.st, s.gp) + ' ST');
    if (s.last5n > 1 && s.gp > s.last5n) {
      lines.push('Last ' + s.last5n + ': ' + avg(s.last5.gl, s.last5n) + ' G/gm · ' + avg(s.last5.as, s.last5n) + ' A/gm');
    }
    if (t.sv || t.ga) {
      const savePct = pct(t.sv, t.sv + t.ga);
      lines.push('In goal: ' + t.sv + ' saves · ' + t.ga + ' GA' + (savePct != null ? ' (' + savePct + '% save rate)' : ''));
    }
  }
  return lines.join('\n');
}

function sharePlayer(p, season, btn) {
  const text = playerShareText(p, season);
  if (navigator.share) {
    navigator.share({ title: p.name + ' · ' + db.settings.team + ' stats', text })
      .catch(() => copyToClipboard(text, btn));
  } else {
    copyToClipboard(text, btn);
  }
}

function b64encode(obj) {
  const json = JSON.stringify(obj);
  return btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}
function b64decode(str) {
  let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  return JSON.parse(decodeURIComponent(escape(atob(b64))));
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const slug = (db.settings.team || 'team').toLowerCase().replace(/[^a-z0-9]+/g, '-');
  a.href = url;
  a.download = slug + '-stats-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importJSONFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      if (!obj || !Array.isArray(obj.players) || !Array.isArray(obj.games)) throw new Error('bad shape');
      if (!confirm('Replace ALL current data with this file? (' + obj.players.length + ' players, ' + obj.games.length + ' games)')) return;
      obj.settings = obj.settings || { team: 'Alameda', season: '' };
      db = obj;
      saveDB();
      location.hash = '#/games';
      render();
    } catch (e) { alert('Could not read that file — it does not look like a stats export.'); }
  };
  reader.readAsText(file);
}

function handleImportLink(encoded) {
  try {
    const obj = b64decode(encoded);
    if (!obj || !Array.isArray(obj.players) || !Array.isArray(obj.games)) throw new Error('bad shape');
    const ok = confirm('This link contains a full stats database (' + obj.players.length + ' players, ' + obj.games.length + ' games).\n\nImport it and REPLACE the data on this device?');
    if (ok) {
      obj.settings = obj.settings || { team: 'Alameda', season: '' };
      db = obj;
      saveDB();
    }
  } catch (e) { alert('That sync link could not be read.'); }
  location.hash = '#/games';
}

function newGame() {
  const g = {
    id: uid(),
    date: todayStr(),
    opponent: '',
    location: '',
    season: db.settings.season || '',
    scoreUs: '',
    scoreThem: '',
    notes: '',
    roster: sortedPlayers(false).map(p => p.id),

function renderGamesView(app) {
  const games = sortedGames().slice().reverse();
  let w = 0, l = 0, t = 0, gf = 0, ga = 0;
  games.forEach(g => {
    const r = gameResult(g);
    if (r === 'w') w++; else if (r === 'l') l++; else if (r === 't') t++;
    if (r) { gf += Number(g.scoreUs); ga += Number(g.scoreThem); }
  });

  app.appendChild(el('div', { class: 'hdr', style: { marginTop: '16px' } },
    el('div', {},
      el('h2', { style: { margin: '0', border: 'none', padding: '0' } }, 'Games'),
      games.length ? el('p', { class: 'subtitle' },
        'Record ' + w + '–' + l + (t ? '–' + t : '') + ' · GF ' + gf + ' · GA ' + ga) : null,
    ),
    el('button', { class: 'btn primary', onClick: newGame }, '+ New game'),
  ));

  if (!games.length) {
    app.appendChild(el('div', { class: 'empty-state' },
      'No games yet. Tap ', el('b', {}, '+ New game'), ' to set up a roster and start tallying stats.'));
    return;
  }

  const list = el('div', { class: 'game-list' });
  games.forEach(g => {
    const r = gameResult(g);
    const badge = r
      ? el('span', { class: 'wl-badge ' + r }, r.toUpperCase())
      : el('span', { class: 'wl-badge na' }, '·');
    const score = r != null || (g.scoreUs !== '' && g.scoreThem !== '')
      ? g.scoreUs + '–' + g.scoreThem : '';
    list.appendChild(el('a', { class: 'game-item', href: '#/game/' + g.id },
      badge,
      el('div', {},
        el('div', { class: 'game-opp' },
          'vs ' + (g.opponent || 'TBD'),
          g.season ? el('span', { class: 'season-chip' }, g.season) : null,
        ),
        el('div', { class: 'game-sub' }, fmtDate(g.date) + (g.location ? ' · ' + g.location : '') + ' · ' + g.roster.length + ' players'),
      ),
      el('div', { class: 'game-score' }, score),
    ));
  });
  app.appendChild(list);
}

let correctionMode = false;

function renderGameView(app, gameId) {

          }
        }
      }, 'Delete game'),
    ),
  ));

  // --- Game details ---

  const details = el('div', { class: 'card' });
  const bind = (field) => (e) => { g[field] = e.target.value; saveDB(); };

    el('input', { type: 'date', value: g.date, onInput: bind('date') }),
  ));
  details.appendChild(el('div', { class: 'form-row' },
    el('label', {}, 'Location'),
    el('input', { type: 'text', value: g.location, placeholder: 'e.g. Esmeralda HS', onInput: bind('location') }),
  ));
  details.appendChild(el('div', { class: 'form-row' },
    el('label', {}, 'Season'),
    el('input', { type: 'text', value: g.season, placeholder: 'e.g. Summer 2026', onInput: bind('season') }),
  ));
  const goalsTallied = g.roster.reduce((n, pid) => n + ((g.stats[pid] && g.stats[pid].gl) || 0), 0);
  details.appendChild(el('div', { class: 'form-row' },
    el('label', {}, 'Final score'),
    el('div', { class: 'score-inputs' },
      el('input', { type: 'number', min: '0', value: g.scoreUs, placeholder: 'Us', onInput: bind('scoreUs') }),
      el('span', { class: 'muted' }, '–'),
      el('input', { type: 'number', min: '0', value: g.scoreThem, placeholder: 'Them', onInput: bind('scoreThem') }),
      el('span', { class: 'muted', style: { fontSize: '11px' } }, goalsTallied ? '(' + goalsTallied + ' goals tallied below)' : ''),
    ),
  ));

    el('label', {}, 'Notes'),
    el('textarea', { placeholder: 'Game notes — what worked, what to fix…', onInput: bind('notes') }, g.notes || ''),
  ));

  // --- Roster for this game ---
  const rosterCard = el('div', { class: 'card' });
  rosterCard.appendChild(el('h3', { style: { marginTop: '0' } }, 'Roster for this game (' + g.roster.length + ')'));
  rosterCard.appendChild(el('p', { class: 'subtitle', style: { margin: '0 0 4px' } },

  const chips = el('div', { class: 'roster-chips' });
  sortedPlayers(true).forEach(p => {
    const inGame = g.roster.indexOf(p.id) >= 0;

      class: 'roster-chip' + (inGame ? ' in' : ''),
      onClick: () => {
        if (inGame) {
          const line = g.stats[p.id];
          const hasStats = line && ALL_STATS.some(s => line[s.key] > 0);
          if (hasStats && !confirm('Remove ' + p.name + ' from this game? Their tallies for THIS game will be deleted.')) return;
          mutate(() => {
            g.roster = g.roster.filter(id => id !== p.id);
            delete g.stats[p.id];
          });
        } else {
          mutate(() => g.roster.push(p.id));
        }

    el('div', { class: 'hdr-actions' },
      correctionMode ? el('span', { class: 'correction-note' }, 'Fix mode: taps subtract 1') : null,
      el('button', {
        class: 'btn small' + (correctionMode ? ' danger' : ''),
        onClick: () => { correctionMode = !correctionMode; render(); }
      }, correctionMode ? 'Done fixing' : '− Fix a mistake'),
    ),
  ));

  const rosterPlayers = g.roster.map(playerById).filter(Boolean).sort(capSort);
  if (!rosterPlayers.length) {
    app.appendChild(el('div', { class: 'empty-state' }, 'Add players to the roster above to start tallying.'));

    const wrap = el('div', { class: 'table-wrap' });

      el('th', { class: 'name-cell' }, 'Player'),

      const line = gameLine(g, p.id);
      const v = line[statKey] || 0;
      if (!enabled) return el('td', {}, el('button', { class: 'tally-cell gk-off', disabled: true }, '·'));
      return el('td', {}, el('button', {
        class: 'tally-cell' + (v === 0 ? ' zero' : ''),
        onClick: () => {
          mutate(() => {
            const ln = gameLine(g, p.id);
            ln[statKey] = Math.max(0, (ln[statKey] || 0) + (correctionMode ? -1 : 1));
          });
        }
      }, v === 0 ? '–' : v));
    };

    rosterPlayers.forEach(p => {
      const line = gameLine(g, p.id);
      const row = el('tr', {},
        el('td', { class: 'name-cell' },
          el('span', { class: 'cap-badge' }, p.cap || '·'),
          el('a', { href: '#/player/' + p.id, style: { color: 'inherit' } }, p.name),

          }, 'GK'),

          p.active
            ? el('button', {
                class: 'btn small danger', onClick: () => {

// Per-game column chart for one stat. Single series (the app's emerald), thin
// rounded-top bars from a hairline baseline, tooltip on hover/tap, sparing labels.
function renderPlayerChart(p, s, season) {
  const chartable = [
    { key: 'gl', label: 'Goals' },
    { key: 'pts', label: 'Points (G+A)' },
    { key: 'sh', label: 'Shots' },
    { key: 'st', label: 'Steals' },
  ];
  if (s.totals.sv > 0) chartable.push({ key: 'sv', label: 'Saves' });
  const statKey = playerChartStat[p.id] || 'gl';
  const active = chartable.find(c => c.key === statKey) || chartable[0];

  const values = s.games.map(g => {
    const line = g.stats[p.id] || emptyLine();
    return active.key === 'pts' ? (line.gl || 0) + (line.as || 0) : (line[active.key] || 0);
  });
  const maxV = Math.max(1, ...values);

  const container = el('div', { class: 'card' });
  container.appendChild(el('div', { class: 'hdr', style: { marginBottom: '2px' } },
    el('h3', { style: { margin: '0' } }, active.label + ' per game'),
    el('div', { class: 'chip-row', style: { margin: '0' } },
      chartable.map(c => el('button', {
        class: 'chip' + (c.key === active.key ? ' active' : ''),
        style: { padding: '3px 9px', fontSize: '11px' },
        onClick: () => { playerChartStat[p.id] = c.key; render(); },
      }, c.label)),
    ),
  ));

  const slot = 30, barW = 18, chartH = 110, padTop = 18, padBottom = 20;
  const width = Math.max(s.games.length * slot + 10, 120);
  const height = chartH + padTop + padBottom;
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', width);
  svg.setAttribute('height', height);
  svg.style.display = 'block';

  const baselineY = padTop + chartH;
  const baseline = document.createElementNS(svgNS, 'line');
  baseline.setAttribute('x1', 0); baseline.setAttribute('x2', width);
  baseline.setAttribute('y1', baselineY); baseline.setAttribute('y2', baselineY);
  baseline.setAttribute('stroke', '#cbd5e1'); baseline.setAttribute('stroke-width', '1');
  svg.appendChild(baseline);

  const wrap = el('div', { class: 'chart-wrap' });
  const tip = el('div', { class: 'chart-tip' });
  const maxIdx = values.indexOf(Math.max(...values));

  values.forEach((v, i) => {
    const x = 5 + i * slot + (slot - barW) / 2;
    const h = Math.round((v / maxV) * chartH);
    const y = baselineY - h;
    const r = Math.min(4, h);
    if (h > 0) {
      const path = document.createElementNS(svgNS, 'path');
      path.setAttribute('d',
        'M' + x + ',' + baselineY +
        ' L' + x + ',' + (y + r) +
        ' Q' + x + ',' + y + ' ' + (x + r) + ',' + y +
        ' L' + (x + barW - r) + ',' + y +
        ' Q' + (x + barW) + ',' + y + ' ' + (x + barW) + ',' + (y + r) +
        ' L' + (x + barW) + ',' + baselineY + ' Z');
      path.setAttribute('fill', '#10b981');
      svg.appendChild(path);
    } else {
      const dot = document.createElementNS(svgNS, 'circle');
      dot.setAttribute('cx', x + barW / 2); dot.setAttribute('cy', baselineY);
      dot.setAttribute('r', 2); dot.setAttribute('fill', '#e2e8f0');
      svg.appendChild(dot);
    }
    // Label only the max bar — tooltip + game log carry the rest.
    if (i === maxIdx && v > 0) {
      const txt = document.createElementNS(svgNS, 'text');
      txt.setAttribute('x', x + barW / 2); txt.setAttribute('y', y - 5);
      txt.setAttribute('text-anchor', 'middle');
      txt.setAttribute('font-size', '11'); txt.setAttribute('font-weight', '700');
      txt.setAttribute('fill', '#334155');
      txt.textContent = v;
      svg.appendChild(txt);
    }
    // First/last date labels only
    if (i === 0 || i === values.length - 1) {
      const txt = document.createElementNS(svgNS, 'text');
      txt.setAttribute('x', x + barW / 2); txt.setAttribute('y', baselineY + 14);
      txt.setAttribute('text-anchor', i === 0 ? 'start' : 'end');
      txt.setAttribute('font-size', '10'); txt.setAttribute('fill', '#94a3b8');
      txt.textContent = fmtDateShort(s.games[i].date);
      svg.appendChild(txt);
    }
    // Full-height invisible hit target for hover/tap tooltip
    const hit = document.createElementNS(svgNS, 'rect');
    hit.setAttribute('x', 5 + i * slot); hit.setAttribute('y', 0);
    hit.setAttribute('width', slot); hit.setAttribute('height', height);
    hit.setAttribute('fill', 'transparent');
    const g = s.games[i];
    const show = () => {
      tip.textContent = fmtDateShort(g.date) + ' vs ' + (g.opponent || 'TBD') + ' — ' + v + ' ' + active.label.toLowerCase().replace(' (g+a)', '');
      tip.style.left = (5 + i * slot + slot / 2) + 'px';
      tip.style.top = (Math.min(baselineY - h, baselineY) - 6) + 'px';
      tip.style.display = 'block';
    };
    hit.addEventListener('mouseenter', show);
    hit.addEventListener('click', show);
    hit.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
    svg.appendChild(hit);
  });

  wrap.appendChild(svg);
  wrap.appendChild(tip);
  container.appendChild(wrap);
  return container;
}

// ==================== VIEWS: DATA ====================
function renderDataView(app) {
  app.appendChild(el('h2', { style: { marginTop: '16px' } }, 'Team settings'));
  const settings = el('div', { class: 'card' });
  settings.appendChild(el('div', { class: 'form-row' },
    el('label', {}, 'Team name'),
    el('input', { type: 'text', value: db.settings.team, onChange: (e) => mutate(() => { db.settings.team = e.target.value.trim() || 'Team'; }) }),
  ));
  settings.appendChild(el('div', { class: 'form-row' },
    el('label', {}, 'Current season'),
    el('input', { type: 'text', value: db.settings.season || '', placeholder: 'e.g. Summer 2026', onChange: (e) => mutate(() => { db.settings.season = e.target.value.trim(); }) }),
  ));
  settings.appendChild(el('p', { class: 'subtitle' }, 'New games are tagged with the current season, so you can filter each player\'s stats by season later.'));
  app.appendChild(settings);

  app.appendChild(el('h2', {}, 'Backup & sync'));
  app.appendChild(el('div', { class: 'path-callout' },
    el('strong', {}, 'Your stats database lives in this browser. '),
    'It survives closing the tab, but export a backup after big stat days — and use the sync link to copy everything to another device (e.g. iPad → phone).'));

  const dataCard = el('div', { class: 'card' });
  const fileIn = el('input', { type: 'file', accept: '.json,application/json', style: { display: 'none' } });
  fileIn.addEventListener('change', () => { if (fileIn.files[0]) importJSONFile(fileIn.files[0]); fileIn.value = ''; });
  dataCard.appendChild(fileIn);
  dataCard.appendChild(el('div', { class: 'hdr-actions' },
    el('button', { class: 'btn primary', onClick: exportJSON }, '⬇ Export backup (JSON)'),
    el('button', { class: 'btn', onClick: () => fileIn.click() }, '⬆ Import backup'),
    el('button', {
      class: 'btn', onClick: (e) => {
        const url = location.origin + location.pathname + '#i=' + b64encode(db);
        copyToClipboard(url, e.currentTarget, 'Link copied!');
      }
    }, '🔗 Copy sync link'),
  ));
  dataCard.appendChild(el('p', { class: 'subtitle', style: { marginTop: '10px' } },
    'The sync link contains the entire database — open it on another device and confirm the import there. Import replaces that device\'s data.'));
  app.appendChild(dataCard);

  app.appendChild(el('h2', {}, 'Danger zone'));
  const danger = el('div', { class: 'card' });
  danger.appendChild(el('button', {
    class: 'btn danger', onClick: () => {
      if (!confirm('Delete ALL players, games and stats from this device?')) return;
      if (!confirm('Really sure? Export a backup first if in doubt. This cannot be undone.')) return;
      db = defaultDB();
      db.players = [];
      saveDB();
      render();
    }
  }, 'Erase all data on this device'));
  app.appendChild(danger);
}

// ==================== ROUTER / MAIN RENDER ====================
function currentRoute() {
  const h = location.hash || '#/games';
  if (h.startsWith('#i=')) return { view: 'import', arg: h.slice(3) };
  const parts = h.replace(/^#\//, '').split('/');
  return { view: parts[0] || 'games', arg: parts[1] };
}

function render() {
  const route = currentRoute();
  document.body.classList.toggle('correcting', correctionMode && route.view === 'game');
  const app = document.getElementById('app');
  app.innerHTML = '';

  app.appendChild(el('div', { class: 'hdr' },
    el('div', {},
      el('h1', {}, db.settings.team + ' · Stat Tracker'),
      el('p', { class: 'subtitle' }, 'Per-player water polo stats · every game, every season'),
    ),
    el('div', { class: 'hdr-actions' },
      el('a', { class: 'btn', href: 'index.html' }, '← Scenario explorer'),
    ),
  ));

  const tab = (id, label, href) => el('a', {
    class: 'tab' + (route.view === id || (id === 'games' && route.view === 'game') || (id === 'players' && route.view === 'player') ? ' active' : ''),
    href,
  }, label);
  app.appendChild(el('div', { class: 'tabs' },
    tab('games', 'Games', '#/games'),
    tab('players', 'Players', '#/players'),
    tab('data', 'Data & backup', '#/data'),
  ));

  if (route.view === 'games') renderGamesView(app);
  else if (route.view === 'game') renderGameView(app, route.arg);
  else if (route.view === 'players') renderPlayersView(app);
  else if (route.view === 'player') renderPlayerView(app, route.arg);
  else if (route.view === 'data') renderDataView(app);
  else renderGamesView(app);
}

window.addEventListener('hashchange', () => {
  const route = currentRoute();
  if (route.view === 'import') { handleImportLink(route.arg); return; }
  correctionMode = false;
  render();
});

// Initial load: handle a sync link, otherwise render current route.
(function init() {
  const route = currentRoute();
  if (route.view === 'import') { handleImportLink(route.arg); }
  saveDB(); // persist seeded roster on first run
  render();
})();
</script>
