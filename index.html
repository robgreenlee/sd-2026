// ==================== URL STATE ====================
function encodeState() {
  const minimal = {
    p: state.poolResults,
    s: state.satResults,
    u: state.sunResults,
    t: state.tiebreakers,
  };
  const empty = !Object.keys(minimal.p).length && !Object.keys(minimal.s).length
    && !Object.keys(minimal.u).length && !Object.keys(minimal.t).length;
  if (empty) return '';
  try {
    const json = JSON.stringify(minimal);
    return btoa(unescape(encodeURIComponent(json)))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
  } catch (e) { return ''; }
}

function decodeStateFromHash() {
  const m = location.hash.match(/[#&]s=([^&]+)/);
  if (!m) return false;
  try {
    let b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    const obj = JSON.parse(decodeURIComponent(escape(atob(b64))));
    state.poolResults = obj.p || {};
    state.satResults = obj.s || {};
    state.sunResults = obj.u || {};
    state.tiebreakers = obj.t || {};
    return true;
  } catch (e) { return false; }
}

let _urlUpdateTimer = null;

  if (_urlUpdateTimer) clearTimeout(_urlUpdateTimer);
  _urlUpdateTimer = setTimeout(() => {
    const enc = encodeState();
    const newHash = enc ? '#s=' + enc : '';
    const newUrl = location.pathname + location.search + newHash;
    history.replaceState(null, '', newUrl);
  }, 100);
}

  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).catch(fallback);
  } else { fallback(); }
  btn.classList.add('copied');
  btn.textContent = 'Copied!';
  setTimeout(() => { btn.classList.remove('copied'); btn.textContent = 'Copy share link'; }, 1500);
}

// ==================== LOGIC ====================
function getPoolStanding(poolCode) {
  const pool = POOLS[poolCode];
  const wins = {};
  pool.teams.forEach(t => wins[t] = 0);
  let complete = true;
  pool.games.forEach(g => {
    const w = state.poolResults[g];
    if (!w) complete = false;
    else wins[w]++;
  });
  if (!complete) return { ready: false, wins };
  const sorted = [...pool.teams].sort((a, b) => wins[b] - wins[a]);
  const allTied = sorted.every(t => wins[t] === 1);
  if (allTied) {
    const tb = state.tiebreakers[poolCode];
    if (!tb || tb.length !== 3 || tb.some(x => !x) || new Set(tb).size !== 3) {
      return { ready: false, needsTiebreaker: true, tbKey: poolCode, wins, teams: pool.teams };
    }
    return { ready: true, order: tb, wins, tied: true };
  }
  return { ready: true, order: sorted, wins, tied: false };
}

function getLamPoolFinish() {
  const s = getPoolStanding('G');
  if (!s.ready) return null;
  return s.order.indexOf(LAM) + 1;
}

function getSatCrossover() {
  const finish = getLamPoolFinish();
  return finish ? SAT_CROSSOVER[finish] : null;
}

function resolveSlot(slot) {
  const cross = getSatCrossover();
  if (!cross) return null;
  const spec = cross.slots[slot];
  if (!spec) return null;
  const [poolCode, seedIdx] = spec;
  const s = getPoolStanding(poolCode);
  if (!s.ready) return null;
  return s.order[seedIdx];
}

function getSatStanding() {
  const cross = getSatCrossover();
  if (!cross) return { ready: false };
  const teamBySlot = {};
  for (const slot of Object.keys(cross.slots)) {
    const t = resolveSlot(slot);
    if (!t) return { ready: false };
    teamBySlot[slot] = t;
  }
  const teams = Object.values(teamBySlot);
  const wins = {};
  teams.forEach(t => wins[t] = 0);
  let complete = true;
  for (const g of cross.games) {
    const w = state.satResults[g.num];
    if (!w) complete = false;
    else wins[w]++;
  }
  if (!complete) return { ready: false, wins, teamBySlot };
  const sorted = [...teams].sort((a, b) => wins[b] - wins[a]);
  const allTied = sorted.every(t => wins[t] === 1);
  if (allTied) {
    const tbKey = 'SAT_' + cross.poolCode;
    const tb = state.tiebreakers[tbKey];
    if (!tb || tb.length !== 3 || tb.some(x => !x) || new Set(tb).size !== 3) {
      return { ready: false, needsTiebreaker: true, tbKey, teams, wins, teamBySlot };
    }
    return { ready: true, order: tb, wins, tied: true, teamBySlot };
  }
  return { ready: true, order: sorted, wins, tied: false, teamBySlot };
}

function getLamSatFinish() {
  const s = getSatStanding();
  if (!s.ready) return null;
  return s.order.indexOf(LAM) + 1;
}

function getSundayPath() {
  const cross = getSatCrossover();
  const finish = getLamSatFinish();
  if (!cross || !finish) return null;
  return SUNDAY_PATHS[cross.poolCode + '-' + finish];
}

function getSundayPathTrace() {
  const path = getSundayPath();
  if (!path) return null;
  const trace = [];
  let currentIdx = 0;
  while (currentIdx < path.games.length) {
    const g = path.games[currentIdx];
    trace.push(g);
    const result = state.sunResults[g.num];
    if (!result) break;
    if (g.terminal) break;
    const nextNum = result === 'w' ? g.winTo : g.loseTo;
    const nextIdx = path.games.findIndex(x => x.num === nextNum);
    if (nextIdx < 0) break;
    currentIdx = nextIdx;
  }
  return { path, trace };
}

function getFinalPlacement() {
  const t = getSundayPathTrace();
  if (!t) return null;
  const last = t.trace[t.trace.length - 1];
  const result = state.sunResults[last.num];
  if (!result) return { pending: true };
  if (!last.terminal) return { pending: true };
  if (last.noPlacement) return { done: true, noPlacement: true };
  return { done: true, place: result === 'w' ? last.winPlace : last.losePlace };
}

// ==================== DOM HELPERS ====================
function el(tag, props, ...children) {
  const e = document.createElement(tag);
  if (props) {
    for (const k in props) {
      if (props[k] == null || props[k] === false) continue;
      if (k === 'style' && typeof props[k] === 'object') Object.assign(e.style, props[k]);
      else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), props[k]);
      else if (k === 'class' || k === 'className') e.className = props[k];
      else if (k === 'html') e.innerHTML = props[k];
      else if (k === 'value') e.value = props[k];
      else if (k === 'selected') e.selected = props[k];
      else e.setAttribute(k, props[k]);
    }
  }
  for (const c of children) {
    if (c == null || c === false) continue;
    if (Array.isArray(c)) c.forEach(cc => cc != null && cc !== false && e.appendChild(typeof cc === 'string' || typeof cc === 'number' ? document.createTextNode(String(cc)) : cc));
    else if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(String(c)));
    else e.appendChild(c);
  }
  return e;
}

// ==================== RENDER PIECES ====================
function renderTeamButton(team, winner, onClick, opts) {
  opts = opts || {};
  const isLam = team === LAM;
  const isFinal = !!opts.isFinal;
  const cls = 'team-btn'
    + (isLam ? ' is-lam' : '')
    + (winner === team ? ' winner' : '')
    + (winner && winner !== team ? ' loser' : '')
    + (isFinal ? ' is-final' : '');
  const children = [team];
  if (opts.score != null) children.push(el('span', { class: 'team-score' }, String(opts.score)));
  return el('button', {
    class: cls,
    disabled: isFinal,
    onClick: isFinal ? null : () => onClick(team),
  }, ...children);
}

function renderMatchupCard(opts) {
  const isLam = opts.home === LAM || opts.away === LAM;
  const complete = !!opts.winner;
  const isFinal = isGameFinal(opts.num);
  const score = PLAYED_SCORES[opts.num];
  const homeScore = score ? score.home : null;
  const awayScore = score ? score.away : null;
  return el('div', { class: 'game-card' + (isLam ? ' is-lam' : '') + (complete ? ' is-complete' : '') },
    el('div', { class: 'game-meta' },
      el('span', {},
        el('span', { class: 'game-id' }, '#' + opts.num),
        isFinal ? el('span', { class: 'final-badge' }, 'FINAL') : null,
      ),
      el('span', {}, opts.time + ' \u00b7 ' + opts.loc),
    ),
    el('div', { class: 'team-row' },
      renderTeamButton(opts.home, opts.winner, opts.onClick, { isFinal, score: homeScore }),
      el('span', { class: 'vs-label' }, 'vs'),
      renderTeamButton(opts.away, opts.winner, opts.onClick, { isFinal, score: awayScore }),
    ),
    opts.extra || null,
  );
}

function renderStandingsBox(standing) {
  const rows = standing.order.map((team, i) => {
    const pos = i + 1;
    const wins = standing.wins[team] != null ? standing.wins[team] : 0;
    const losses = 2 - wins;
    return el('div', { class: 'standing-row' + (team === LAM ? ' lam' : '') },
      el('span', { class: 'pos-badge p' + pos }, ['1st','2nd','3rd'][pos-1]),
      el('span', { class: 'team-name' + (team === LAM ? ' lam' : '') }, team),
      el('span', { class: 'record-text' }, wins + '\u2013' + losses),
    );
  });
  const note = standing.tied ? el('div', { class: 'standings-note' }, 'Three-way tie at 1\u20131 \u00b7 seeding set manually above') : null;
  return el('div', { class: 'standings-box' }, ...rows, note);
}

function renderTiebreaker(tbKey, teams) {
  const current = state.tiebreakers[tbKey] || [null, null, null];
  const setSeed = (pos, team) => {
    const next = [...(state.tiebreakers[tbKey] || [null, null, null])];
    for (let i = 0; i < 3; i++) if (next[i] === team) next[i] = null;
    next[pos] = team || null;
    state.tiebreakers[tbKey] = next;
    if (tbKey === 'G') clearDownstreamFromPool();
    else if (tbKey.startsWith('SAT_')) clearDownstreamFromSat();
    render();
  };
  const makeSelect = (pos) => {
    const opts = [el('option', { value: '' }, '\u2014 pick team \u2014')];
    teams.forEach(t => {
      const o = el('option', { value: t }, t);
      if (current[pos] === t) o.selected = true;
      opts.push(o);
    });
    return el('select', { onChange: (e) => setSeed(pos, e.target.value) }, ...opts);
  };
  return el('div', { class: 'tiebreaker-box' },
    el('div', { class: 'tb-title' }, 'Three-way tie \u2014 all teams 1\u20131'),
    el('p', { class: 'tb-desc' }, 'The tournament breaks this by goal differential. Pick the seeding manually:'),
    el('div', { class: 'tb-pickers' },
      el('div', { class: 'tb-row' }, el('label', {}, '1st seed'), makeSelect(0)),
      el('div', { class: 'tb-row' }, el('label', {}, '2nd seed'), makeSelect(1)),
      el('div', { class: 'tb-row' }, el('label', {}, '3rd seed'), makeSelect(2)),
    ),
  );
}

function renderPoolPlaySection() {
  const container = el('div', {});
  ['G', 'B', 'J'].forEach(poolCode => {
    const pool = POOLS[poolCode];
    const standing = getPoolStanding(poolCode);
    const section = el('div', { class: 'pool-section' });
    section.appendChild(el('h3', {}, pool.label + ' \u00b7 ' + pool.teams.join(' \u00b7 ')));
    const grid = el('div', { class: 'games-grid' });
    pool.games.forEach(gNum => {
      const g = GAMES[gNum];
      grid.appendChild(renderMatchupCard({
        num: gNum,
        time: g.time,
        loc: g.loc,
        home: g.home,
        away: g.away,
        winner: state.poolResults[gNum],
        onClick: (team) => {
          state.poolResults[gNum] = team;
          delete state.tiebreakers[poolCode];
          clearDownstreamFromPool();
          render();
        },
      }));
    });
    section.appendChild(grid);
    if (standing.needsTiebreaker) {
      section.appendChild(renderTiebreaker(standing.tbKey, standing.teams));
    } else if (standing.ready) {
      section.appendChild(renderStandingsBox(standing));
    }
    container.appendChild(section);
  });
  return container;
}

function renderSaturdaySection() {
  const gStanding = getPoolStanding('G');
  const bStanding = getPoolStanding('B');
  const jStanding = getPoolStanding('J');
  if (!gStanding.ready) {
    return el('div', { class: 'empty-state' }, 'Complete Pool G games (including any tiebreaker) to see the Saturday crossover.');
  }
  if (!bStanding.ready || !jStanding.ready) {
    const finish = getLamPoolFinish();
    const cross = SAT_CROSSOVER[finish];
    return el('div', {},
      el('div', { class: 'path-callout' },
        'Lamorinda B finishes ', el('strong', {}, ['1st','2nd','3rd'][finish-1] + ' in Pool G'),
        ' \u2192 heading to ', el('strong', {}, cross.label), '.',
      ),
      el('div', { class: 'empty-state', style: { marginTop: '10px' } }, 'Finish Pool B and Pool J games to resolve the crossover opponents.'),
    );
  }
  const cross = getSatCrossover();
  const finish = getLamPoolFinish();
  const teamBySlot = {};
  for (const slot of Object.keys(cross.slots)) teamBySlot[slot] = resolveSlot(slot);

  const container = el('div', {});
  container.appendChild(el('div', { class: 'path-callout' },
    'Lamorinda B finishes ', el('strong', {}, ['1st','2nd','3rd'][finish-1] + ' in Pool G'),
    ' \u2192 enters ', el('strong', {}, cross.label), '. All games at Tierrasanta.',
  ));
  container.appendChild(el('h3', {}, cross.poolCode + ' games \u00b7 ' + Object.values(teamBySlot).join(' \u00b7 ')));

  const grid = el('div', { class: 'games-grid' });
  cross.games.forEach(g => {
    const home = teamBySlot[g.a];
    const away = teamBySlot[g.b];
    grid.appendChild(renderMatchupCard({
      num: g.num,
      time: g.time,
      loc: 'Tierrasanta',
      home, away,
      winner: state.satResults[g.num],
      onClick: (team) => {
        state.satResults[g.num] = team;
        delete state.tiebreakers['SAT_' + cross.poolCode];
        clearDownstreamFromSat();
        render();
      },
    }));
  });
  container.appendChild(grid);

  const satStanding = getSatStanding();
  if (satStanding.needsTiebreaker) {
    container.appendChild(renderTiebreaker(satStanding.tbKey, Object.values(teamBySlot)));
  } else if (satStanding.ready) {
    container.appendChild(renderStandingsBox(satStanding));
  }
  return container;
}

function renderSundaySection() {
  const satStanding = getSatStanding();
  if (!satStanding.ready) {
    return el('div', { class: 'empty-state' }, 'Complete Saturday crossover games to see the Sunday bracket path.');
  }
  const satFinish = getLamSatFinish();
  const cross = getSatCrossover();
  const path = getSundayPath();
  const trace = getSundayPathTrace().trace;

  const container = el('div', {});
  container.appendChild(el('div', { class: 'path-callout' },
    'Lamorinda B finishes ', el('strong', {}, ['1st','2nd','3rd'][satFinish-1] + ' in Pool ' + cross.poolCode),
    ' \u2192 heading to ', el('strong', {}, path.bracket), '.',
  ));
  container.appendChild(el('h3', {}, 'Sunday bracket games'));

  const grid = el('div', { class: 'games-grid' });
  trace.forEach(g => {
    const result = state.sunResults[g.num];
    const winCls = 'team-btn is-lam' + (result === 'w' ? ' winner' : '') + (result === 'l' ? ' loser' : '');
    const loseCls = 'team-btn' + (result === 'l' ? ' winner' : '') + (result === 'w' ? ' loser' : '');
    let loseLabel = 'Lamorinda LOSES';
    let winLabel = 'Lamorinda WINS';
    if (g.terminal && !g.noPlacement) {
      const ord = (n) => n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th';
      winLabel = 'WIN \u2192 ' + g.winPlace + ord(g.winPlace);
      loseLabel = 'LOSE \u2192 ' + g.losePlace + ord(g.losePlace);
    }
    const extra = el('div', { class: 'next-hint' }, g.role + ' \u00b7 opponent: ' + g.opp);
    const advance = (res) => {
      state.sunResults[g.num] = res;
      const newTrace = [g];
      let cur = g;
      while (!cur.terminal) {
        const r = state.sunResults[cur.num];
        if (!r) break;
        const nn = r === 'w' ? cur.winTo : cur.loseTo;
        const next = path.games.find(x => x.num === nn);
        if (!next) break;
        newTrace.push(next);
        cur = next;
      }
      const keepNums = new Set(newTrace.map(x => x.num));
      Object.keys(state.sunResults).forEach(k => { if (!keepNums.has(parseInt(k))) delete state.sunResults[k]; });
      render();
    };
    grid.appendChild(el('div', { class: 'game-card is-lam' + (result ? ' is-complete' : '') },
      el('div', { class: 'game-meta' },
        el('span', { class: 'game-id' }, '#' + g.num),
        el('span', {}, g.time + ' \u00b7 ' + g.loc),
      ),
      el('div', { class: 'team-row' },
        el('button', { class: winCls, onClick: () => advance('w') }, winLabel),
        el('span', { class: 'vs-label' }, 'vs'),
        el('button', { class: loseCls, onClick: () => advance('l') }, loseLabel),
      ),
      extra,
    ));
  });
  container.appendChild(grid);
  return container;
}

function renderFinalPlacement() {
  const fp = getFinalPlacement();
  if (!fp || fp.pending) return null;
  if (fp.noPlacement) {
    return el('div', { class: 'placement-hero low' },
      el('div', { class: 'hero-label' }, 'Final result'),
      el('div', { class: 'hero-place' }, 'Consolation'),
      el('div', { class: 'hero-desc' }, 'This path ends in a single Sunday crossover with no posted final place on the schedule. Lamorinda finishes outside the top 16.'),
    );
  }
  const place = fp.place;
  const ord = ['th','st','nd','rd'];
  const suffix = (place % 100 >= 11 && place % 100 <= 13) ? 'th' : (ord[place % 10] || 'th');
  let cls = 'placement-hero';
  if (place > 4 && place <= 8) cls += ' silver';
  else if (place > 8 && place <= 12) cls += ' mid';
  else if (place > 12) cls += ' low';
  return el('div', { class: cls },
    el('div', { class: 'hero-label' }, 'Final placement'),
    el('div', { class: 'hero-place' }, place + suffix),
    el('div', { class: 'hero-desc' }, 'of 36 teams \u00b7 14U Boys A \u00b7 San Diego County Cup'),
  );
}

// ==================== MAIN RENDER ====================
function render() {
  updateURL();
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(el('div', { class: 'hdr' },
    el('div', {},
      el('h1', {}, 'Lamorinda B \u00b7 Scenario Explorer'),
      el('p', { class: 'subtitle' }, 'San Diego County Cup \u00b7 14U Boys A \u00b7 May 1\u20133, 2026'),
    ),
    el('div', { class: 'hdr-actions' },
      el('a', { class: 'btn', href: SCHEDULE_URL, target: '_blank', rel: 'noopener' }, 'View full schedule \u2197'),
      el('a', { class: 'btn', href: GROUPME_URL, target: '_blank', rel: 'noopener' }, 'GroupMe \u2197'),
      el('a', { class: 'btn', href: VOLUNTEER_URL, target: '_blank', rel: 'noopener' }, 'Volunteer sheet \u2197'),
      el('button', { class: 'btn primary', onClick: (e) => copyShareLink(e.currentTarget) }, 'Copy share link'),
      el('button', { class: 'btn', onClick: resetAll }, 'Reset all'),
    ),
  ));

  app.appendChild(el('h2', {}, 'Pool Play \u00b7 Friday + Saturday AM'));
  app.appendChild(el('p', { class: 'subtitle', style: { margin: '0 0 12px' } }, 'Click the winner of each pool game. Lamorinda\'s finish in Pool G decides the Saturday track.'));
  app.appendChild(renderPoolPlaySection());

  app.appendChild(el('h2', {}, 'Saturday Crossover'));
  app.appendChild(renderSaturdaySection());

  app.appendChild(el('h2', {}, 'Sunday Bracket'));
  app.appendChild(renderSundaySection());

  const fp = renderFinalPlacement();
  if (fp) app.appendChild(fp);
}

function renderVenues() {
  const root = document.getElementById('venues');
  if (!root) return;
  root.innerHTML = '';
  root.appendChild(el('h2', {}, 'Locations'));
  const groups = [
    { kind: 'venue', label: 'Tournament venues' },
    { kind: 'travel', label: 'Travel' },
  ];
  groups.forEach(g => {
    const items = VENUES.filter(v => v.kind === g.kind);
    if (!items.length) return;
    root.appendChild(el('h3', { class: 'venue-group' }, g.label));
    const list = el('div', { class: 'venue-list' });
    items.forEach(v => {
      const q = encodeURIComponent(v.name + ', ' + v.address);
      const url = 'https://www.google.com/maps/search/?api=1&query=' + q;
      list.appendChild(el('a', { class: 'venue-item', href: url, target: '_blank', rel: 'noopener' },
        el('div', { class: 'venue-name' }, v.name),
        el('div', { class: 'venue-aliases' }, v.aliases),
        el('div', { class: 'venue-addr' }, v.address),
        el('div', { class: 'venue-maps' }, 'Open in Google Maps ↗'),
      ));
    });
    root.appendChild(list);
  });
}

// Decode any state from URL hash, then render. If no hash, pre-fill
// played games so the explorer reflects the tournament's current state.
if (!decodeStateFromHash()) {
  state.poolResults = { ...PLAYED_POOL_RESULTS };
}
render();
renderVenues();

// Re-render if user navigates back/forward through hash history
window.addEventListener('hashchange', () => {
  const ok = decodeStateFromHash();
  if (ok) render();
});
</script>
