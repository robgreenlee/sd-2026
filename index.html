function parseSheetSlot(s) {
  const seed = s.match(/^(\d+)-/);
  if (seed && TEAMS[parseInt(seed[1], 10)]) return parseInt(seed[1], 10);
  const ref = s.match(/^([WL]\d+)(?:-|$)/); // 'W3' or Kahuna's 'W3-TEAM VEGAS RED'
  if (ref) return ref[1];
  return null;
}

function parseSheetDest(s) {
  if (/^\d+$/.test(s)) return parseInt(s, 10);
  if (/^(ag|bz)_[A-Z]\d?$/.test(s)) return s;
  return null;
}

function prettyVenue(loc) {
  return loc.toLowerCase().replace(/\b\w/g, c => c.toUpperCase())
    .replace(/\bHs\b/g, 'HS').replace(/\bCc\b/g, 'CC').replace(/\bUc\b/g, 'UC');
}

function applyLiveData(data) {
  (data.games || []).forEach(g => {
    const model = GAMES[g.n];
    if (!model) return;
    if (g.time) model.time = g.time;
    if (g.loc) {
      const v = prettyVenue(g.loc);
      if (v !== model.venue) { model.venue = v; model.venueLive = true; }
    }
    const w = parseSheetSlot(g.white), d = parseSheetSlot(g.dark);
    if (w != null) model.white = w;
    if (d != null) model.dark = d;
    const wTo = parseSheetDest(g.wTo), lTo = parseSheetDest(g.lTo);
    if (wTo != null) model.wTo = wTo;
    if (lTo != null) model.lTo = lTo;
    if (g.ws != null && g.ds != null && g.ws !== g.ds) {
      const side = g.ws > g.ds ? 'w' : 'd';
      if (state.results[g.n] !== side) clearDownstream(g.n);
      PLAYED_RESULTS[g.n] = side;
      PLAYED_SCORES[g.n] = { w: g.ws, d: g.ds };
    }
  });
  state.results = { ...state.results, ...PLAYED_RESULTS };
}

function isGameFinal(num) { return Object.prototype.hasOwnProperty.call(PLAYED_RESULTS, num); }

// ==================== LOGIC ====================
function resolveSlot(slot) {
  if (typeof slot === 'number') return teamLabel(slot);
  let m = String(slot).match(/^([WL])(\d+)$/);
  if (m) {
    const num = Number(m[2]);
    const r = state.results[num];
    if (!r) return null;
    const g = GAMES[num];
    const winSide = r === 'w' ? g.white : g.dark;
    const loseSide = r === 'w' ? g.dark : g.white;
    return resolveSlot(m[1] === 'W' ? winSide : loseSide);
  }
  m = String(slot).match(/^P([123])@(\w+)$/);
  if (m) {
    const order = groupOrder(m[2]);
    return order ? order[Number(m[1]) - 1] : null;
  }
  return null;
}

// Final order of a Day-2 group: wins, then goal difference within the group
// (the tournament's tiebreak). Returns null until every game is decided and
// any three-way tie is breakable with known scores.
function groupOrder(gKey) {
  const grp = DAY2_GROUPS[gKey];
  const nums = GROUP_GAMES[gKey];
  if (!grp || !nums) return null;
  const teams = grp.slots.map(s => resolveSlot(s[1]));
  if (teams.some(t => !t)) return null;
  const wins = {}, gd = {};
  teams.forEach(t => { wins[t] = 0; gd[t] = 0; });
  for (const num of nums) {
    const r = state.results[num];
    if (!r) return null;
    const g = GAMES[num];
    const wName = resolveSlot(r === 'w' ? g.white : g.dark);
    const lName = resolveSlot(r === 'w' ? g.dark : g.white);
    if (!wName || !lName) return null;
    wins[wName]++;
    const sc = PLAYED_SCORES[num];
    if (sc) {
      // Floor: decimal scores are shootout notation, a regulation tie (GD 0).
      const diff = Math.abs(Math.floor(Number(sc.w)) - Math.floor(Number(sc.d)));
      gd[wName] += diff; gd[lName] -= diff;
    }
  }
  const sorted = [...teams].sort((a, b) => wins[b] - wins[a] || gd[b] - gd[a]);
  if (teams.every(t => wins[t] === 1)) {
    // Three-way tie — only breakable when all scores are known and distinct.
    if (!nums.every(n => PLAYED_SCORES[n])) return null;
    const v = sorted.map(t => gd[t]);
    if (v[0] === v[1] || v[1] === v[2]) return null;
  }
  return sorted;
}

const ORD = { 1: '1st', 2: '2nd', 3: '3rd' };
function slotHint(slot) {
  if (typeof slot === 'number') return teamLabel(slot);
  let m = String(slot).match(/^([WL])(\d+)$/);
  if (m) return (m[1] === 'W' ? 'Winner' : 'Loser') + ' of #' + m[2];
  m = String(slot).match(/^P([123])@(\w+)$/);
  if (m && DAY2_GROUPS[m[2]]) return ORD[m[1]] + ' of ' + DAY2_GROUPS[m[2]].label;
  return String(slot);
}

// Games whose slots reference game num — used to clear downstream picks.
const DEPENDENTS = {};
for (const numStr in GAMES) {
  const num = Number(numStr);
  [GAMES[num].white, GAMES[num].dark].forEach(slot => {
    let m = String(slot).match(/^[WL](\d+)$/);
    if (m) { (DEPENDENTS[Number(m[1])] = DEPENDENTS[Number(m[1])] || []).push(num); return; }
    m = String(slot).match(/^P[123]@(\w+)$/);
    if (m && GROUP_GAMES[m[1]]) {
      GROUP_GAMES[m[1]].forEach(n => (DEPENDENTS[n] = DEPENDENTS[n] || []).push(num));
    }
  });
}

function clearDownstream(num) {
  (DEPENDENTS[num] || []).forEach(dep => {
    if (state.results[dep] != null && !isGameFinal(dep)) {
      delete state.results[dep];
      clearDownstream(dep);
    }
  });
}

function pickWinner(num, side) {
  if (isGameFinal(num)) return;
  if (state.results[num] === side) return;
  state.results[num] = side;
  clearDownstream(num);
  render();
}

// Trace Lamorinda's Day-1 path from game 15.
function lamTrace() {
  const path = [];
  let cur = 15;
  let terminal = null;
  for (;;) {
    path.push(cur);
    const r = state.results[cur];
    if (!r) break;
    const g = GAMES[cur];
    const winner = resolveSlot(r === 'w' ? g.white : g.dark);
    const next = winner === LAM ? g.wTo : g.lTo;
    if (typeof next === 'number') { cur = next; continue; }
    terminal = next;
    break;
  }
  return { path, terminal };
}

// Games shown in "our games only" mode: Lamorinda's traced path plus the
// transitive closure of games its slots depend on — so the opponent of each
// path game can still be resolved without leaving the filtered view.
// Lamorinda's next unplayed game (any day) where both slots resolve.
function lamNextGameNum() {
  const nums = Object.keys(GAMES).map(Number).sort((a, b) => a - b);
  for (const num of nums) {
    if (state.results[num]) continue;
    const g = GAMES[num];
    if (resolveSlot(g.white) === LAM || resolveSlot(g.dark) === LAM) return num;
  }
  return null;
}

// Final placement, once a placement game involving Lamorinda is decided.
function lamPlacement() {
  for (const numStr in GAMES) {
    const num = Number(numStr);
    const r = state.results[num];
    if (!r) continue;
    const g = GAMES[num];
    const w = resolveSlot(g.white), d = resolveSlot(g.dark);
    if (w !== LAM && d !== LAM) continue;
    const winner = r === 'w' ? w : d;
    const dest = winner === LAM ? g.wTo : g.lTo;
    if (typeof dest === 'string' && /(st|nd|rd|th)$/.test(dest)) return dest;
  }
  return null;
}

function lamVisibleGames() {
  const set = new Set();
  const addWithDeps = (num) => {
    if (set.has(num)) return;
    set.add(num);
    [GAMES[num].white, GAMES[num].dark].forEach(slot => {
      let m = String(slot).match(/^[WL](\d+)$/);
      if (m) { addWithDeps(Number(m[1])); return; }
      m = String(slot).match(/^P[123]@(\w+)$/);
      if (m && GROUP_GAMES[m[1]]) GROUP_GAMES[m[1]].forEach(addWithDeps);
    });
  };
  lamTrace().path.forEach(addWithDeps);
  Object.keys(GAMES).map(Number).forEach(num => {
    const g = GAMES[num];
    if (resolveSlot(g.white) === LAM || resolveSlot(g.dark) === LAM) addWithDeps(num);
  });
  return set;
}

// ==================== URL STATE ====================
function encodeState() {
  const filtered = {};
  for (const k in state.results) if (!isGameFinal(Number(k))) filtered[k] = state.results[k];
  if (!Object.keys(filtered).length) return '';
  try {
    return btoa(unescape(encodeURIComponent(JSON.stringify(filtered))))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
  } catch (e) { return ''; }
}

function decodeStateFromHash() {
  const m = location.hash.match(/[#&]s=([^&]+)/);
  if (!m) return false;
  try {
    let b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    const obj = JSON.parse(decodeURIComponent(escape(atob(b64))));
    state.results = { ...obj, ...PLAYED_RESULTS };
    return true;
  } catch (e) { return false; }
}

let _urlUpdateTimer = null;
function updateURL() {
  if (_urlUpdateTimer) clearTimeout(_urlUpdateTimer);
  _urlUpdateTimer = setTimeout(() => {
    const enc = encodeState();
    history.replaceState(null, '', location.pathname + location.search + (enc ? '#s=' + enc : ''));
  }, 100);
}

function copyShareLink(btn) {
  const enc = encodeState();
  const url = location.origin + location.pathname + location.search + (enc ? '#s=' + enc : '');
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = url; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).catch(fallback);
  else fallback();
  btn.classList.add('copied');
  btn.textContent = 'Copied!';
  setTimeout(() => { btn.classList.remove('copied'); btn.textContent = 'Copy share link'; }, 1500);
}

// ==================== DOM HELPERS ====================
function el(tag, props, ...children) {
  const e = document.createElement(tag);
  if (props) {
    for (const k in props) {
      if (props[k] == null || props[k] === false) continue;
      if (k === 'style' && typeof props[k] === 'object') Object.assign(e.style, props[k]);
      else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), props[k]);
      else if (k === 'class' || k === 'className') e.className = props[k];
      else e.setAttribute(k, props[k]);
    }
  }
  for (const c of children) {
    if (c == null || c === false) continue;
    if (Array.isArray(c)) c.forEach(cc => cc != null && cc !== false && e.appendChild(typeof cc === 'string' || typeof cc === 'number' ? document.createTextNode(String(cc)) : cc));
    else if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(String(c)));
    else e.appendChild(c);
  }
  return e;
}

function renderGameCard(num) {

  const r = state.results[num];
  const winnerName = r ? (r === 'w' ? whiteName : darkName) : null;
  const isFinal = isGameFinal(num);
  const score = PLAYED_SCORES[num];
  const gmid = '14BX-' + String(num).padStart(3, '0');

  const sideBtn = (side, name, slot) => {
    const cls = 'team-btn'
      + (name === LAM ? ' is-lam' : '')
      + (!name ? ' pending' : '')
      + (r === side ? ' winner' : '')
      + (r && r !== side ? ' loser' : '')
      + (isFinal ? ' is-final' : '');
    const children = [name || slotHint(slot)];
    if (score) children.push(el('span', { class: 'team-score' }, String(side === 'w' ? score.w : score.d)));
    return el('button', {
      class: cls,
      disabled: isFinal || !name || !whiteName || !darkName,
      onClick: () => pickWinner(num, side),
    }, ...children);
  };

  return el('div', { class: 'game-card' + (isLam ? ' is-lam' : '') + (r ? ' is-complete' : '') },
    el('div', { class: 'game-meta' },
      el('span', {},
        el('span', { class: 'game-id' }, '#' + num),
        isFinal ? el('span', { class: 'final-badge' }, 'FINAL') : null,
      ),
      el('span', {}, g.time + (g.venueLive ? ' · ' + g.venue : '') + ' · ' + gmid),

    el('div', { class: 'team-row' },
      sideBtn('w', whiteName, g.white),
      el('span', { class: 'vs-label' }, 'vs'),
      sideBtn('d', darkName, g.dark),

    el('div', { class: 'next-hint' },
      (g.label ? g.label + ' · ' : '')
      + (g.wTo != null ? 'Win → ' + nextLabel(g.wTo) + ' · Lose → ' + nextLabel(g.lTo)

}

    box.appendChild(el('div', { class: 'path-callout' },
      el('strong', {}, 'Lamorinda B: '), 'waiting on other results or group standings to set the next matchup.',
    ));
  }
  if (terminal) {
    const info = terminalInfo(terminal);
    if (info.group) box.appendChild(renderDay2Group(info.group));
  }
  return box;
}

// Live-feed status pill — shown inside the Admin panel only.
function renderLivePill() {
  const fmtT = (d) => new Date(d).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  let pillClass = 'live-pill', pillText;
  if (!liveInfo.fetchedAt) {
    pillText = 'Checking the JO sheet for schedule updates…';
  } else if (liveInfo.error) {
    pillClass += ' err';
    const detail = String(liveInfo.error).replace(/^Could not load the schedule — /, '');
    pillText = 'Last checked ' + fmtT(liveInfo.fetchedAt) + ' — sheet unreachable'
      + (liveInfo.updatedAt ? ' (showing data from ' + fmtT(liveInfo.updatedAt) + ')' : '')
      + ' · ' + (detail.length > 120 ? detail.slice(0, 120) + '…' : detail);
  } else {
    pillClass += ' ok';
    const srcLabel = { byname: 'live sheet', htmlview: 'live sheet', export: 'live sheet', gviz: 'live sheet', custom: 'live sheet', kahuna: 'Kahuna results', paste: 'pasted sheet' }[liveInfo.source] || '';
    pillText = (liveInfo.source === 'paste' ? 'Scores from pasted sheet (' + fmtT(liveInfo.updatedAt) + ')' :
      'Schedule & scores checked ' + fmtT(liveInfo.updatedAt) + ' — auto-updates every 5 min')
      + (srcLabel && liveInfo.source !== 'paste' ? ' · ' + srcLabel : '');
  }
  // Pulsing broadcast icon — arcs animate while the live feed is healthy.
  const ico = el('span', { class: 'live-ico', 'aria-hidden': 'true' });
  ico.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">'
    + '<circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/>'
    + '<path class="arc" d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7"/>'
    + '<path class="arc arc-outer" d="M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"/>'
    + '</svg>';
  return el('div', { class: pillClass, style: { margin: '0 0 10px' } },
    ico,
    pillText, ' · ',
    el('a', { href: '#', onClick: (e) => { e.preventDefault(); fetchLive(true); } }, 'check now'),
  );
}

// Admin panel — feed status + the manual paste fallback, toggled from the header.
function renderAdminPanel() {
  const box = el('div', { class: 'day2-box', style: { borderColor: '#94a3b8' } });
  box.appendChild(el('h3', { style: { marginTop: '0' } }, 'Admin · Live feed & manual score update'));
  box.appendChild(renderLivePill());
  const ta = el('textarea', {
    placeholder: 'Open the 14U_Men_Classic tab (or the Kahuna results page), Select All, Copy, and paste everything here…',
    style: { width: '100%', minHeight: '90px', border: '1px solid #cbd5e1', borderRadius: '6px', padding: '8px', font: 'inherit', fontSize: '12px' },
  });
  const pasteBtn = el('button', {
    class: 'btn primary', style: { marginTop: '8px' },
    onClick: async (e) => {
      const btn = e.currentTarget;
      if (!ta.value.trim()) { ta.focus(); return; }
      btn.textContent = 'Applying…';
      try {
        const r = await fetch('api/schedule', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'paste', text: ta.value }),
        });
        const out = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(out.error || ('HTTP ' + r.status));
        applyLiveData(out);
        liveInfo.updatedAt = new Date();
        liveInfo.source = 'paste';
        liveInfo.error = null;
        render();
        alert('Applied ' + out.count + ' games' + (out.stored ? ' — shared to every device.' : ' on this device (connect the Redis store to share automatically).'));
      } catch (err) {
        btn.textContent = 'Apply pasted schedule';
        alert(err && err.message ? err.message : 'Could not parse that paste.');
      }
    },
  }, 'Apply pasted schedule');
  box.appendChild(el('p', { class: 'subtitle', style: { margin: '0 0 8px' } },
    'If automatic updates are down, paste a copy of the schedule here (Select All → Copy on the sheet or the Kahuna results page). Scores are parsed exactly like the live feed.'));
  box.appendChild(ta);
  box.appendChild(el('div', {}, pasteBtn));
  return box;
}

function renderDay2Group(key) {
  const grp = DAY2_GROUPS[key];
  const box = el('div', { class: 'day2-box' });
  box.appendChild(el('h3', { style: { marginTop: '0' } }, grp.label + ' · Fri July 24 round robin'));
  grp.slots.forEach(([seed, src]) => {
    const name = src ? resolveSlot(src) : null;
    const isLam = name === LAM;
    box.appendChild(el('div', { class: 'day2-slot' + (isLam ? ' lam' : '') },
      el('span', { class: 'seed-badge' }, seed),
      el('span', { class: 'slot-name' + (isLam ? ' lam' : '') + (!name ? ' tbd' : '') },
        name || (src ? slotHint(src) : 'TBD — not yet published')),
    ));
  });
  return box;
}

function render() {
  updateURL();
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(el('div', { class: 'hdr' },
    el('div', {},
      el('h1', {}, "LAMO JO's B-Team"),
      el('p', { class: 'subtitle' }, '2026 National Junior Olympics · Session 2 · 14U Men Classic (14BX) · July 23–26 · Orange County'),
    ),
    el('div', { class: 'hdr-actions' },
      el('button', {
        class: 'btn' + (filterLam ? ' primary' : ''),
        onClick: () => setFilterLam(!filterLam),
      }, filterLam ? '★ Our games only' : 'Our games only'),
      el('a', { class: 'btn', href: 'stats.html' }, 'Player stats →'),
      el('a', { class: 'btn', href: SCHEDULE_URL, target: '_blank', rel: 'noopener' }, 'JO schedule sheet ↗'),
      el('a', { class: 'btn', href: GROUPME_URL, target: '_blank', rel: 'noopener' }, 'GroupMe ↗'),
      el('button', {
        class: 'btn' + (adminOpen ? ' primary' : ''),
        onClick: () => { adminOpen = !adminOpen; render(); },
      }, adminOpen ? '⚙ Admin' : 'Admin'),
      el('button', { class: 'btn primary', onClick: (e) => copyShareLink(e.currentTarget) }, 'Copy share link'),
      el('button', { class: 'btn', onClick: resetAll }, 'Reset all'),
    ),
  ));

  if (adminOpen) app.appendChild(renderAdminPanel());

  app.appendChild(renderLamPath());

  app.appendChild(el('div', { class: 'warn-callout' },
    el('strong', {}, 'Bracket notes: '),
    'All four days are modeled: Day-1 group mini-brackets feed the Silver (winners) and Bronze brackets, Day-2 group round robins seed the Day 3–4 placement brackets, down to the championships. ',
    'Finished games lock in automatically with a FINAL badge; group standings use wins then goal difference. ',
    'Day 2–4 venues show TBD until the sheet publishes them — matchups and times are from the bracket template and self-correct from the live feed.',
  ));

  const visible = filterLam ? lamVisibleGames() : null;
  if (filterLam) {
    app.appendChild(el('p', { class: 'subtitle', style: { margin: '0 0 4px' } },
      'Showing Lamorinda’s path plus the games that decide each opponent. Pick winners to reveal the next round.'));
  }
  VENUE_SECTIONS.forEach(sec => {
    const nums = visible ? sec.games.filter(n => visible.has(n)) : sec.games;
    if (!nums.length) return;
    app.appendChild(el('h2', {}, sec.name + (sec.lam ? ' · LAMORINDA' : '')));
    app.appendChild(el('p', { class: 'subtitle', style: { margin: '0 0 12px' } }, sec.sub + ' · ' + sec.date));
    const grid = el('div', { class: 'games-grid' });
    nums.forEach(num => grid.appendChild(renderGameCard(num)));
    app.appendChild(grid);
  });

  app.appendChild(el('h2', {}, 'Day 1 groups'));
  const ggrid = el('div', { class: 'games-grid' });
  Object.keys(GROUPS).forEach(code => {
    if (filterLam && code !== 'G') return;
    ggrid.appendChild(el('div', { class: 'game-card' + (code === 'G' ? ' is-lam' : '') },
      el('div', { class: 'game-meta' }, el('span', { class: 'game-id' }, 'Group ' + code)),
      el('div', { style: { fontSize: '13px', lineHeight: '1.7' } },
        GROUPS[code].map(s => el('div', { style: s === 18 ? { color: '#047857', fontWeight: '700' } : null }, teamLabel(s))),
      ),
    ));
  });
  app.appendChild(ggrid);
}

function renderVenues() {
  const root = document.getElementById('venues');
  if (!root) return;
  root.innerHTML = '';
  root.appendChild(el('h2', {}, 'Venues'));
  const list = el('div', { class: 'venue-list' });
  VENUES.forEach(v => {
    const q = encodeURIComponent(v.name + ', ' + v.address);
    list.appendChild(el('a', { class: 'venue-item', href: 'https://www.google.com/maps/search/?api=1&query=' + q, target: '_blank', rel: 'noopener' },
      el('div', { class: 'venue-name' }, v.name),
      el('div', { class: 'venue-aliases' }, v.aliases),
      el('div', { class: 'venue-addr' }, v.address),
      el('div', { class: 'venue-maps' }, 'Open in Google Maps ↗'),
    ));
  });
  root.appendChild(list);
}

if (!decodeStateFromHash()) {
  state.results = { ...PLAYED_RESULTS };
}
render();
renderVenues();
fetchLive(false);

window.addEventListener('hashchange', () => {
  if (decodeStateFromHash()) render();
});
</script>
