// ==================== STATE ====================
// results[num] = 'w' | 'd' — which side won game num.
const state = { results: {} };

// ==================== LIVE SHEET SYNC ====================
// /api/schedule proxies the published Google Sheet a few times per hour.
// Finished games become locked FINAL results; matchup/time/venue/routing
// corrections from the sheet override the static model below.
let liveInfo = { updatedAt: null, error: null, fetchedAt: 0 };

function parseSheetSlot(s) {
  const seed = s.match(/^(\d+)-/);
  if (seed && TEAMS[parseInt(seed[1], 10)]) return parseInt(seed[1], 10);
  if (/^[WL]\d+$/.test(s)) return s;
  return null;
}

function parseSheetDest(s) {
  if (/^\d+$/.test(s)) return parseInt(s, 10);
  if (/^(ag|bz)_[A-Z]\d?$/.test(s)) return s;
  return null;
}

function prettyVenue(loc) {
  return loc.toLowerCase().replace(/\b\w/g, c => c.toUpperCase())
    .replace(/\bHs\b/g, 'HS').replace(/\bCc\b/g, 'CC').replace(/\bUc\b/g, 'UC');
}

function applyLiveData(data) {
  (data.games || []).forEach(g => {
    const model = GAMES[g.n];
    if (!model) return;
    if (g.time) model.time = g.time;
    if (g.loc) {
      const v = prettyVenue(g.loc);
      if (v !== model.venue) { model.venue = v; model.venueLive = true; }
    }
    const w = parseSheetSlot(g.white), d = parseSheetSlot(g.dark);
    if (w != null) model.white = w;
    if (d != null) model.dark = d;
    const wTo = parseSheetDest(g.wTo), lTo = parseSheetDest(g.lTo);
    if (wTo != null) model.wTo = wTo;
    if (lTo != null) model.lTo = lTo;
    if (g.ws != null && g.ds != null && g.ws !== g.ds) {
      const side = g.ws > g.ds ? 'w' : 'd';
      if (state.results[g.n] !== side) clearDownstream(g.n);
      PLAYED_RESULTS[g.n] = side;
      PLAYED_SCORES[g.n] = { w: g.ws, d: g.ds };
    }
  });
  state.results = { ...state.results, ...PLAYED_RESULTS };
}

async function fetchLive(manual) {
  liveInfo.fetchedAt = Date.now();
  try {
    const r = await fetch('api/schedule' + (manual ? '?t=' + Date.now() : ''));
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
    applyLiveData(data);
    liveInfo.updatedAt = data.source === 'paste' && data.updatedAt ? new Date(data.updatedAt) : new Date();
    liveInfo.source = data.source || '';
    liveInfo.error = null;
  } catch (e) {
    liveInfo.error = e && e.message ? e.message : 'fetch failed';
  }
  render();
}

setInterval(() => fetchLive(false), 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => {

});

// Games already played — fill in as the tournament runs (side that won + score).
const PLAYED_RESULTS = {};
// Final scores keyed by game number: { w: <white goals>, d: <dark goals> }
const PLAYED_SCORES = {};

function isGameFinal(num) { return Object.prototype.hasOwnProperty.call(PLAYED_RESULTS, num); }

// ==================== LOGIC ====================
function resolveSlot(slot) {
  if (typeof slot === 'number') return teamLabel(slot);
  const m = String(slot).match(/^([WL])(\d+)$/);
  if (!m) return null;
  const num = Number(m[2]);
  const r = state.results[num];
  if (!r) return null;
  const g = GAMES[num];
  const winSide = r === 'w' ? g.white : g.dark;
  const loseSide = r === 'w' ? g.dark : g.white;
  return resolveSlot(m[1] === 'W' ? winSide : loseSide);
}

function slotHint(slot) {
  if (typeof slot === 'number') return teamLabel(slot);
  const m = String(slot).match(/^([WL])(\d+)$/);
  return m ? (m[1] === 'W' ? 'Winner' : 'Loser') + ' of #' + m[2] : String(slot);
}

// Games whose slots reference game num — used to clear downstream picks.
const DEPENDENTS = {};
for (const numStr in GAMES) {
  const num = Number(numStr);
  [GAMES[num].white, GAMES[num].dark].forEach(slot => {
    const m = String(slot).match(/^[WL](\d+)$/);
    if (m) (DEPENDENTS[Number(m[1])] = DEPENDENTS[Number(m[1])] || []).push(num);
  });
}

function clearDownstream(num) {
  (DEPENDENTS[num] || []).forEach(dep => {
    if (state.results[dep] != null && !isGameFinal(dep)) {
      delete state.results[dep];
      clearDownstream(dep);
    }
  });
}

function pickWinner(num, side) {
  if (isGameFinal(num)) return;
  if (state.results[num] === side) return;
  state.results[num] = side;
  clearDownstream(num);
  render();
}

// Trace Lamorinda's Day-1 path from game 15.
function lamTrace() {
  const path = [];
  let cur = 15;
  let terminal = null;
  for (;;) {
    path.push(cur);
    const r = state.results[cur];
    if (!r) break;
    const g = GAMES[cur];
    const winner = resolveSlot(r === 'w' ? g.white : g.dark);
    const next = winner === LAM ? g.wTo : g.lTo;
    if (typeof next === 'number') { cur = next; continue; }
    terminal = next;
    break;
  }
  return { path, terminal };
}

// Games shown in "our games only" mode: Lamorinda's traced path plus the
// transitive closure of games its slots depend on — so the opponent of each
// path game can still be resolved without leaving the filtered view.
function lamVisibleGames() {
  const { path } = lamTrace();
  const set = new Set();
  const addWithDeps = (num) => {
    if (set.has(num)) return;
    set.add(num);
    [GAMES[num].white, GAMES[num].dark].forEach(slot => {
      const m = String(slot).match(/^[WL](\d+)$/);
      if (m) addWithDeps(Number(m[1]));
    });
  };
  path.forEach(addWithDeps);
  return set;
}

// ==================== URL STATE ====================
function encodeState() {
  const filtered = {};
  for (const k in state.results) if (!isGameFinal(Number(k))) filtered[k] = state.results[k];
  if (!Object.keys(filtered).length) return '';
  try {
    return btoa(unescape(encodeURIComponent(JSON.stringify(filtered))))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
  } catch (e) { return ''; }
}

function decodeStateFromHash() {
  const m = location.hash.match(/[#&]s=([^&]+)/);
  if (!m) return false;
  try {
    let b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    const obj = JSON.parse(decodeURIComponent(escape(atob(b64))));
    state.results = { ...obj, ...PLAYED_RESULTS };
    return true;
  } catch (e) { return false; }
}

let _urlUpdateTimer = null;
function updateURL() {
  if (_urlUpdateTimer) clearTimeout(_urlUpdateTimer);
  _urlUpdateTimer = setTimeout(() => {
    const enc = encodeState();
    history.replaceState(null, '', location.pathname + location.search + (enc ? '#s=' + enc : ''));
  }, 100);
}

function copyShareLink(btn) {
  const enc = encodeState();
  const url = location.origin + location.pathname + location.search + (enc ? '#s=' + enc : '');
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = url; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).catch(fallback);
  else fallback();
  btn.classList.add('copied');
  btn.textContent = 'Copied!';
  setTimeout(() => { btn.classList.remove('copied'); btn.textContent = 'Copy share link'; }, 1500);
}

function resetAll() {
  state.results = { ...PLAYED_RESULTS };
  render();
}

// ==================== DOM HELPERS ====================
function el(tag, props, ...children) {
  const e = document.createElement(tag);
  if (props) {
    for (const k in props) {
      if (props[k] == null || props[k] === false) continue;
      if (k === 'style' && typeof props[k] === 'object') Object.assign(e.style, props[k]);
      else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), props[k]);
      else if (k === 'class' || k === 'className') e.className = props[k];
      else e.setAttribute(k, props[k]);
    }
  }
  for (const c of children) {
    if (c == null || c === false) continue;
    if (Array.isArray(c)) c.forEach(cc => cc != null && cc !== false && e.appendChild(typeof cc === 'string' || typeof cc === 'number' ? document.createTextNode(String(cc)) : cc));
    else if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(String(c)));
    else e.appendChild(c);
  }
  return e;
}

// ==================== RENDER ====================
function nextLabel(dest) {
  if (typeof dest === 'number') return '#' + dest;
  return terminalInfo(dest).text.replace('Day 2 ', '').replace(' bracket', '');

function renderGameCard(num) {
  const g = GAMES[num];
  const whiteName = resolveSlot(g.white);
  const darkName = resolveSlot(g.dark);
  const isLam = whiteName === LAM || darkName === LAM;
  const r = state.results[num];
  const winnerName = r ? (r === 'w' ? whiteName : darkName) : null;
  const isFinal = isGameFinal(num);
  const score = PLAYED_SCORES[num];
  const gmid = '14BX-' + String(num).padStart(3, '0');

  const sideBtn = (side, name, slot) => {
    const cls = 'team-btn'
      + (name === LAM ? ' is-lam' : '')
      + (!name ? ' pending' : '')
      + (r === side ? ' winner' : '')
      + (r && r !== side ? ' loser' : '')
      + (isFinal ? ' is-final' : '');
    const children = [name || slotHint(slot)];
    if (score) children.push(el('span', { class: 'team-score' }, String(side === 'w' ? score.w : score.d)));
    return el('button', {
      class: cls,
      disabled: isFinal || !name || !whiteName || !darkName,
      onClick: () => pickWinner(num, side),
    }, ...children);
  };

  return el('div', { class: 'game-card' + (isLam ? ' is-lam' : '') + (r ? ' is-complete' : '') },
    el('div', { class: 'game-meta' },
      el('span', {},
        el('span', { class: 'game-id' }, '#' + num),
        isFinal ? el('span', { class: 'final-badge' }, 'FINAL') : null,
      ),
      el('span', {}, g.time + (g.venueLive ? ' · ' + g.venue : '') + ' · ' + gmid),
    ),
    el('div', { class: 'team-row' },
      sideBtn('w', whiteName, g.white),
      el('span', { class: 'vs-label' }, 'vs'),
      sideBtn('d', darkName, g.dark),
    ),
    el('div', { class: 'next-hint' }, 'Win → ' + nextLabel(g.wTo) + ' · Lose → ' + nextLabel(g.lTo)),
  );
}

function renderLamPath() {
  const { path, terminal } = lamTrace();
  const box = el('div', {});
  const last = path[path.length - 1];
  const lastGame = GAMES[last];
  if (!state.results[15]) {

    ));

}
